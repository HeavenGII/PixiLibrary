<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive Button Demo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #FFFFFF;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="./pixi/pixi.4.3.2.js"></script>
  <script src="./pixi/tink.js"></script>
  <script type="text/javascript">
    let type = "WebGL";
    if (!PIXI.utils.isWebGLSupported()) {
      type = "canvas";
    }

    let Container = PIXI.Container,
      autoDetectRenderer = PIXI.autoDetectRenderer,
      loader = PIXI.loader,
      resources = PIXI.loader.resources,
      Sprite = PIXI.Sprite,
      TextureCache = PIXI.utils.TextureCache,
      Graphics = PIXI.Graphics,
      Text = PIXI.Text,
      TilingSprite = PIXI.extras.TilingSprite,
      Point = PIXI.Point,
      Rope = PIXI.mesh.Rope,
      Rectangle = PIXI.Rectangle;

    let stage = new Container(), 
        renderer = autoDetectRenderer(512, 512);
    
    document.body.appendChild(renderer.view);
    renderer.backgroundColor = 0xFFFFFF;

    let t = new Tink(PIXI, renderer.view);
    let pointer = t.makePointer();

    loader
      .add('button', './images/button.png')
      .load(setup);

    function setup() {
      let texture = resources['button'].texture;
      
      let frameWidth = 194;
      let frameHeight = 100;
      
      let frames = [
        new Rectangle(frameWidth * 2, 0, frameWidth, frameHeight),       
        new Rectangle(frameWidth, 0, frameWidth, frameHeight),
        new Rectangle(0, 0, frameWidth, frameHeight) 
      ];
        let buttonTextures = frames.map(frame => {
            let tex = new PIXI.Texture(texture);
            tex.frame = frame;
            return tex;
        });
      
      let playButton = t.button(buttonTextures, 32, 96);
      stage.addChild(playButton);

      gameLoop();
    }
    
    function gameLoop() {
      requestAnimationFrame(gameLoop);
      t.update(); 
      renderer.render(stage);
    }
  </script>
</body>
</html>

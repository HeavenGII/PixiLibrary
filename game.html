<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive Button Demo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #FFFFFF;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="./pixi/pixi.4.3.2.js"></script>
  <script src="./pixi/tink.js"></script>
  <script src="./pixi/spriteUtilities.js"></script>
  <script type="text/javascript">
    let type = "WebGL";
    if (!PIXI.utils.isWebGLSupported()) {
      type = "canvas";
    }

    let Container = PIXI.Container,
      autoDetectRenderer = PIXI.autoDetectRenderer,
      loader = PIXI.loader,
      resources = PIXI.loader.resources,
      Sprite = PIXI.Sprite,
      TextureCache = PIXI.utils.TextureCache,
      Graphics = PIXI.Graphics,
      Text = PIXI.Text,
      TilingSprite = PIXI.extras.TilingSprite,
      Point = PIXI.Point,
      Rope = PIXI.mesh.Rope,
      Rectangle = PIXI.Rectangle;

    let stage = new Container(), 
        renderer = autoDetectRenderer(512, 512);
    
    document.body.appendChild(renderer.view);
    let blocks = new Container()
    stage.addChild(blocks)
    let t = new Tink(PIXI, renderer.view);
    let su = new SpriteUtilities(PIXI);
    let pointer = t.makePointer();
    let gapSize = 4, numberOfPillars = 15, pixie = [];

    let gravity = 0.2;
    let jumpForce = -5;
    let isJumping = false;

    loader
      .add('clouds', './images/clouds.png')
      .add('greenBlock', './images/greenBlock.png')
      .add('finish', './images/finish.png')
      .add('pixie', './images/pixieFrames.png')
      .load(setup);
    let sky, greenBlock = [], finish
    function setup() {
        sky = new TilingSprite(TextureCache[`clouds`], renderer.view.width, renderer.view.height)
        blocks.addChild(sky)
        for(let i = 0; i<numberOfPillars; i++){
            let startGapNumber = randomInt(0,8-gapSize)
            if (i > 0 && i % 5 === 0) gapSize -= 1;
            for(let j = 0; j<8; j++){
                if (j < startGapNumber || j > startGapNumber + gapSize - 1) {
                    let greenBlockTexture = resources['greenBlock'].texture
                    let block = new Sprite(greenBlockTexture)
                    block.scale.set(0.25)       
                    blocks.addChild(block);
                    block.x = (i * 384) + 512;
                    block.y = j* 64;
                    greenBlock.push(block);
                }
            }
            if (i === numberOfPillars - 1) {
                let finishTexture = loader.resources['finish'].texture
                finish = new Sprite(finishTexture)
                blocks.addChild(finish)
                finish.x = (i * 384) + 696;
                finish.y = 96;
                finish.scale.set(0.5)
            }
        }

        let pixieTexture = loader.resources['pixie'].texture
        let frameWidth = 48, frameHeight= 32, frames;

        frames = su.filmstrip("pixie", 48, 32);
        pixie = su.sprite(frames)
        blocks.addChild(pixie)
        pixie.fps = 12
        pixie.states = {
            walkUp: [0,2]
        }
        pixie.playAnimation(pixie.states.walkUp)

        pixie.position.set(232, 32);
        pixie.vy = 0;
        
        pointer.tap = function() {
            pixie.vy = jumpForce;
            isJumping = true;
        };

        renderer.render(blocks);
        gameLoop();
    }
    
    function gameLoop() {
      requestAnimationFrame(gameLoop);
      
      pixie.vy += gravity;
      pixie.y += pixie.vy;
      
      if (pixie.y > renderer.view.height - pixie.height) {
        pixie.y = renderer.view.height - pixie.height;
        pixie.vy = 0;
        isJumping = false;
      }
      if (pixie.y < 0) {
        pixie.y = 0;
        pixie.vy = 0;
      }
      
      if (pixie.x > renderer.view.width * 0.6) {
        blocks.x -= 2;
      }
      play()
      t.update(); 
      renderer.render(stage);
    }
    function play(){
        sky.tilePosition.x -= 2;
        greenBlock.forEach(block => {
            block.x -= 2;
            if (hitTestRectangle(pixie, block)) {
                pixie.visible = false
                reset()
            }
        })
        finish.x-=2


        if(finish.x <0){
            blocks.visible = false
            let text = new Text(
                'You won. Congratulations!',
                {font: "32px disko", fill: "White"}

            )
            stage.addChild(text)
            text.x = renderer.view.width / 2 - text.width/2
            text.y = renderer.view.height /2 - text.height/2
        }

    }
    function hitTestRectangle(sprite1, sprite2) {
      return sprite1.x < sprite2.x + sprite2.width &&
             sprite1.x + sprite1.width > sprite2.x &&
             sprite1.y < sprite2.y + sprite2.height &&
             sprite1.y + sprite1.height > sprite2.y
    }
    
    function randomInt(min, max){
        return Math.floor(Math.random()*(max-min+1))+min
    }
    function reset() {
        pixie.visible = true;
        pixie.y = 32;
        blocks.x = 0;
    }

  </script>
</body>
</html>

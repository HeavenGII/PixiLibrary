<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello World</title>
</head>
<body>
  <script src="./pixi/pixi.4.3.2.js"></script>
  <script src="./pixi/charm.js"></script>
  <script type="text/javascript">
    let type = "WebGL";
    if (!PIXI.utils.isWebGLSupported()) {
      type = "canvas";
    }

    let Container = PIXI.Container,
      autoDetectRenderer = PIXI.autoDetectRenderer,
      loader = PIXI.loader,
      resources = PIXI.loader.resources,
      Sprite = PIXI.Sprite,
      TextureCache = PIXI.utils.TextureCache,
      Graphics = PIXI.Graphics,
      Text = PIXI.Text,
      TilingSprite = PIXI.extras.TilingSprite,
      Point = PIXI.Point,
      Rope = PIXI.mesh.Rope,
      Rectangle = PIXI.Rectangle;

    let stage = new Container(), 
      renderer = autoDetectRenderer(512, 512);
    
    document.body.appendChild(renderer.view);
    renderer.backgroundColor = 0xFFFFFF;
    c = new Charm(PIXI);
    let waypoints = [
        [32, 32], //First x/y point
        [32, 128], //Next x/y point
        [300, 128], //Next x/y point
        [300, 32], //Next x/y point
        [32, 32] //Last x/y point
    ];
    loader
      .add('pixie', './images/pixieFrames.png')
      .load(setup);
      let cat, pixie, counter = 0

    function setup() {
        const pixieTexture = resources[`pixie`].texture
        let pixie1 = new Rectangle(0,0,48,32)
        pixieTexture.frame = pixie1
        pixie = new Sprite(pixieTexture)
        stage.addChild(pixie)

        gameLoop()
 
    }
    
    function gameLoop(){
    requestAnimationFrame(gameLoop)
    state();
    c.update();
    
    renderer.render(stage);
    }

    function state(){
        pixie.anchor.set(0.5, 0.5);

        c.walkPath(
            pixie,
            waypoints,
            300,
            'smoothstep',
            true,
            true,
            1000
        )

    }
    
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello World</title>
</head>
<body>
  <script src="./pixi/pixi.4.3.2.js"></script>
  <script type="text/javascript">
    let type = "WebGL";
    if (!PIXI.utils.isWebGLSupported()) {
      type = "canvas";
    }

    let Container = PIXI.Container,
      autoDetectRenderer = PIXI.autoDetectRenderer,
      loader = PIXI.loader,
      resources = PIXI.loader.resources,
      Sprite = PIXI.Sprite,
      TextureCache = PIXI.utils.TextureCache;

    let stage = new Container(),
      app = autoDetectRenderer(512, 512);
    document.body.appendChild(app.view);

    loader
      .add('treasureHunter', './images/treasureHunter.json')
      .load(setup);

    let dungeon, explorer, treasure, door;
    let indexOfBlobs = 6, spacing = 48, xOffset = 150;
    let state

    function setup() {
      let texture = TextureCache['frameId.png']
      let sprite = new Sprite(texture)

      let dungeonTexture = TextureCache['dungeon.png']
      let explorerTexture = TextureCache['explorer.png']
      let treasureTexture = TextureCache['treasure.png']
      let doorTexture = TextureCache['door.png']
      let blobTexture = TextureCache['blob.png']

      dungeon = new Sprite(dungeonTexture)
      explorer = new Sprite(explorerTexture)
      treasure = new Sprite(treasureTexture)
      door = new Sprite(doorTexture)

      stage.addChild(dungeon)
      stage.addChild(explorer)
      stage.addChild(treasure)
      stage.addChild(door)

      explorer.position.set(68, app.height/2 - explorer.height/2)
      treasure.position.set(dungeon.width-treasure.width-68, app.height/2 - treasure.height/2)
      door.position.set(0+door.width, 0)

      for(let i = 0; i<indexOfBlobs;  i++){
        blob = new Sprite(blobTexture)

        let x = spacing*i + xOffset
        let y = randomInt(0, stage.height-blob.height)
        blob.x = x
        blob.y = y
        stage.addChild(blob)
      }
      
      function randomInt(min, max){
        return Math.floor(Math.random()*(max-min+1))+min
      }
      explorer.vx = 0
      explorer.vy = 0
      var left = keyboard(37) , right = keyboard(39), up = keyboard(38), down = keyboard(40);
      left.press = () =>{
        explorer.vx = -5;
        explorer.vy = 0;
      }
      left.release = () =>{
        if(!right.isDown && explorer.vy ==0){
          explorer.vx = 0
        }
      }
      up.press = ()=>{
        explorer.vx = 0;
        explorer.vy = -5
      }
      up.release = () =>{
        if(!down.isDown && explorer.vx == 0){
          explorer.vy = 0
        }
      }
      right.press = () =>{
        explorer.vx = 5;
        explorer.vy = 0;
      }
      right.release = () =>{
        if(!left.isDown && explorer.vy == 0){
          explorer.vx = 0
        }
      }
      down.press = () =>{
        explorer.vx = 0
        explorer.vy = 5
      }
      down.release = () =>{
        if(!down.isDown && explorer.vx == 0){
          explorer.vy = 0
        }
      }
      state = play
      gameLoop()

    }
    
    function gameLoop(){
      requestAnimationFrame(gameLoop)

      state()
      app.render(stage)
    }
    function play(){
      explorer.x+=explorer.vx
      explorer.y+=explorer.vy

      let collision = contain(
      explorer,
      {
        x:0,
        y:0,
        width: app.view.width,
        height: app.view.height
      }
    )
    if(collision){
      if(collision.has('left') || collision.has('right')){
        explorer.vx = -explorer.vx
      }
      if(collision.has('top') || collision.has('bottom')){
        explorer = -explorer.vy
      }
    }
    }

    function keyboard(keyCode){
      let key = {}
      key.code = keyCode
      key.isDown = false
      key.isUp = true
      key.press = undefined
      key.release = undefined
      key.downHandler = event =>{
        if(event.keyCode === key.code){
          if(key.isUp && key.release) key.press()
          key.isDown = true
          key.isUp = false
        }
        event.preventDefault();
      }
      key.upHandler = event =>{
        if(event.keyCode === key.code){
          if(key.isDown && key.release) key.press()
          key.isDown = false
          key.isUp = true
        }
        event.preventDefault();
      }
      window.addEventListener(
        'keydown', key.downHandler.bind(key), false
      )
      window.addEventListener(
        'keyup', key.upHandler.bind(key), false
      )
      return key
    }

  </script>
</body>
</html>

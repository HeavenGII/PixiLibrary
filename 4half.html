<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Treasure Hunter</title>

</head>
<body>
  <script src="./pixi/pixi.4.3.2.js"></script>
  <script type="text/javascript">
    let type = "WebGL";
    if (!PIXI.utils.isWebGLSupported()) {
      type = "canvas";
    }

    let Container = PIXI.Container,
      autoDetectRenderer = PIXI.autoDetectRenderer,
      loader = PIXI.loader,
      resources = PIXI.loader.resources,
      Sprite = PIXI.Sprite,
      TextureCache = PIXI.utils.TextureCache,
      Graphics = PIXI.Graphics,
      Text = PIXI.Text,
      Texture = PIXI.Texture,
      Rectangle = PIXI.Rectangle;

    let stage = new Container(), 
      gameScene = new Container(), 
      gameOverScene = new Container(),
      healthBar = new Container(),
      renderer = autoDetectRenderer(512, 512);
    
    document.body.appendChild(renderer.view);
    stage.addChild(gameScene)
    stage.addChild(gameOverScene)
    gameOverScene.visible = false

    loader
      .add('treasureHunter', './images/treasureHunter.json')
      .load(setup)

    let dungeon, explorer, treasure, door, message
    let indexOfBlobs = 6, spacing = 48, xOffset = 150, speed = 2, direction = 1, blobs = []
    let state, explorerHit = false
    let left, right, up, down
    let moveSpeed = 3

    function contain(sprite, bounds) {
      if (!sprite) return new Set()
      
      let collision = new Set()
      
      if (sprite.x < bounds.x) {
        sprite.x = bounds.x
        collision.add("left")
      }
      
      if (sprite.y < bounds.y) {
        sprite.y = bounds.y
        collision.add("top")
      }
      
      if (sprite.x + sprite.width > bounds.width) {
        sprite.x = bounds.width - sprite.width
        collision.add("right")
      }
      
      if (sprite.y + sprite.height > bounds.height) {
        sprite.y = bounds.height - sprite.height
        collision.add("bottom")
      }
      
      return collision
    }

    function hitTestRectangle(sprite1, sprite2) {
      return sprite1.x < sprite2.x + sprite2.width &&
             sprite1.x + sprite1.width > sprite2.x &&
             sprite1.y < sprite2.y + sprite2.height &&
             sprite1.y + sprite1.height > sprite2.y
    }

    function setup() {
      let dungeonTexture = TextureCache['dungeon.png']
      let explorerTexture = TextureCache['explorer.png']
      let treasureTexture = TextureCache['treasure.png']
      let doorTexture = TextureCache['door.png']
      let blobTexture = TextureCache['blob.png']

      dungeon = new Sprite(dungeonTexture)
      explorer = new Sprite(explorerTexture)
      treasure = new Sprite(treasureTexture)
      door = new Sprite(doorTexture)

      explorer.vx = 0
      explorer.vy = 0
      explorerHit = false

      gameScene.addChild(dungeon)
      gameScene.addChild(explorer)
      gameScene.addChild(treasure)
      gameScene.addChild(door)

      explorer.position.set(68, renderer.height/2 - explorer.height/2)
      treasure.position.set(dungeon.width-treasure.width-68, renderer.height/2 - treasure.height/2)
      door.position.set(0+door.width, 0)

      for(let i = 0; i < indexOfBlobs; i++) {
        let blob = new Sprite(blobTexture)
        let x = spacing*i + xOffset
        let y = randomInt(0, stage.height-blob.height)
        blob.x = x
        blob.y = y
        blob.vy = speed*direction
        direction *= -1
        blobs.push(blob)
        gameScene.addChild(blob)
      }

      healthBar.position.set(stage.width -170,4)
      gameScene.addChild(healthBar)
      
      let innerBar = new Graphics()
      innerBar.beginFill(0x000000)
      innerBar.drawRect(0,0,128,8)
      innerBar.endFill()
      healthBar.addChild(innerBar)

      let outerBar = new Graphics()
      outerBar.beginFill(0xFF3300)
      outerBar.drawRect(0,0,128,8)
      outerBar.endFill()
      healthBar.addChild(outerBar)
      healthBar.outer = outerBar
      healthBar.outer.width = 30

      message = new Text(
        "The End!",
        {
          fontFamily: "Futura",
          fontSize: 48,
          fill: 0xFFFFFF
        }
      )
      message.x = 120
      message.y = stage.height/2 -32
      gameOverScene.addChild(message)
      
      setupKeyboardControls()
      
      state = play
      gameLoop()
    }
    
    function setupKeyboardControls() {
      left = keyboard(37), up = keyboard(38), right = keyboard(39), down = keyboard(40) 

      left.press = () => {
        explorer.vx = -moveSpeed
      }
      left.release = () => {
        if (!right.isDown) {
          explorer.vx = 0
        }
      }
      
      right.press = () => {
        explorer.vx = moveSpeed;
      }
      right.release = () => {
        if (!left.isDown) {
          explorer.vx = 0;
        }
      }
      
      up.press = () => {
        explorer.vy = -moveSpeed;
      }
      up.release = () => {
        if (!down.isDown) {
          explorer.vy = 0;
        }
      }
      
      down.press = () => {
        explorer.vy = moveSpeed;
      }
      down.release = () => {
        if (!up.isDown) {
          explorer.vy = 0
        }
      }
    }
    
    function gameLoop(){
      requestAnimationFrame(gameLoop)
      explorerHit = false
      blobs.forEach(blob => {
        blob.y += blob.vy
        let blobHitsWall = contain(
          blob,
          {x: 28, y: 10, width: 488, height: 480}
        )
        if(blobHitsWall){
          if(blobHitsWall.has('top') || blobHitsWall.has("bottom")){
            blob.vy *= -1
          }
        }
        if(hitTestRectangle(explorer, blob)) {
          explorerHit = true;
        }
      })
      
      if(explorerHit){
        explorer.alpha = 0.5
        healthBar.outer.width -= 1
      } else {
        explorer.alpha = 1
      }
      
      if(hitTestRectangle(explorer, treasure)){
        treasure.x = explorer.x + 8
        treasure.y = explorer.y + 8
      }
      
      if(hitTestRectangle(treasure, door)){
        state = end
        message.text = 'You won!'
      }
      
      if(healthBar.outer.width < 0){
        state = end
        message.text = 'You lost!'
      }
      
      state()
      renderer.render(stage)
    }
    
    function play(){
      explorer.x += explorer.vx
      explorer.y += explorer.vy
      contain(explorer, {
        x: 28,
        y: 10,
        width: 488,
        height: 480
      })
    }
    
    function end(){
      gameScene.visible = false
      gameOverScene.visible = true
    
    }

    function randomInt(min, max){
      return Math.floor(Math.random()*(max-min+1))+min
    }

    function keyboard(keyCode){
      let key = {}
      key.code = keyCode
      key.isDown = false
      key.isUp = true
      key.press = undefined
      key.release = undefined
      
      key.downHandler = event => {
        if(event.keyCode === key.code){
          if(key.isUp && key.press) key.press();
          key.isDown = true
          key.isUp = false
        }
        event.preventDefault();
      }
    
      key.upHandler = event => {
        if(event.keyCode === key.code){
          if(key.isDown && key.release) key.release()
          key.isDown = false
          key.isUp = true
        }
        event.preventDefault()
      }
      
      window.addEventListener('keydown', key.downHandler.bind(key), false)
      window.addEventListener('keyup', key.upHandler.bind(key), false)
      
      return key
    }
  </script>
</body>
</html>
